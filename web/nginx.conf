server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Toutes les routes inconnues renvoient index.html pour le routeur React.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Logs vers stdout/stderr pour que Docker Compose les collecte.
    access_log /dev/stdout;
    error_log  /dev/stderr warn;
}
