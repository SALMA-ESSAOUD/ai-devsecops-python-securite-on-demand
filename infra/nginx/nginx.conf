server {
    listen 80;
    server_name _;

    # ── En-têtes de sécurité de base ─────────────────────────────────────────
    # Empêche les navigateurs de deviner le Content-Type (sniffing MIME).
    add_header X-Content-Type-Options "nosniff" always;
    # Interdit l'affichage dans une iframe (protection clickjacking).
    add_header X-Frame-Options "DENY" always;
    # Limite les informations envoyées dans le Referer aux cross-origins.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── API Django : proxy vers le service backend ───────────────────────────
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Front-end React : proxy vers le service web ──────────────────────────
    location / {
        proxy_pass         http://web:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
